    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f0e;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        
        @keyframes scrollBanner {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: var(--scroll) 0;
            }
        }

        .matrix-banner {
            --banner-h: 100%;
            --scroll: -1600px;
            background-image: url("img/banner.png");
            background-size: auto var(--banner-h);
            background-repeat: repeat-x;
            animation: scrollBanner 80s linear infinite;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 639px) {
            .matrix-banner {
                --banner-h: 180px;
                --scroll: -1440px;
            }
        }
        
        

        .avatar-aura {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, #39ff14 0deg 4deg, transparent 4deg 15deg);
            -webkit-mask: radial-gradient(farthest-side, transparent 62%, black 63%);
            mask: radial-gradient(farthest-side, transparent 62%, black 63%);
            filter: drop-shadow(0 0 6px #22c55e) drop-shadow(0 0 14px #00ff00);
            animation: pulseGlow 3s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.98);
                opacity: 0.85;
                filter: drop-shadow(0 0 4px #22c55e);
            }
            100% {
                transform: scale(1.03);
                opacity: 1;
                filter: drop-shadow(0 0 14px #00ff00) drop-shadow(0 0 22px #10b981);
            }
        }

        .speech-pointer {
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background-color: #232521;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            z-index: 1;
        }
        
        .font-madness {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.5px;
        }
        
        .font-everything {
            font-family: 'Special Elite', monospace;
            letter-spacing: 2px;
        }

        .btn-link {
            display: block;
            width: 100%;
            text-decoration: none;
            color: inherit;
        }

        .btn-link:visited {
            color: inherit;
        }

        .link-button {
            background: transparent;
            border-radius: 10px;
            border: 2px solid #FFF;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            filter: drop-shadow(10px 15px 4px #0000009d);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 18px;
            margin: auto;
            opacity: 0.7;
            padding: 10px 16px;
            transition: .3s;
            width: 100%;
            fill: #FFF;
            cursor: pointer;
        }

        .link-button:hover {
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px solid #FFF;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
            color: #FFF;
            opacity: 1;
            transition: .3s;
        }

        .link-button:focus {
            outline: none;
        }

        .link-button svg {
            flex-shrink: 0;
            height: auto;
            max-width: 24px;
            opacity: inherit;
            position: relative;
            transition: .3s;
        }

        
    </style>
</head>
