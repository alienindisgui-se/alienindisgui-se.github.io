<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,600&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f0e;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        
        @keyframes scrollBanner {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: var(--scroll) 0;
            }
        }

        .matrix-banner {
            --banner-h: 200px;
            --scroll: -1600px;
            background-image: url("img/x123a.png");
            background-size: auto var(--banner-h);
            background-repeat: repeat-x;
            animation: scrollBanner 40s linear infinite;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 639px) {
            .matrix-banner {
                --banner-h: 180px;
                --scroll: -1440px;
            }
        }
        
        /* .matrix-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("img/123.png");
            mix-blend-mode: overlay;
            pointer-events: none;
        } */

        .avatar-aura {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: repeating-ocnic-gradient(from 0deg, #39ff14 0deg 4deg, transparent 4deg 15deg);
            -webkit-mask: radial-gradient(farthest-side, transparent 62%, black 63%);
            mask: radial-gradient(farthest-side, transparent 62%, black 63%);
            filter: drop-shadow(0 0 6px #22c55e) drop-shadow(0 0 14px #00ff00);
            animation: pulseGlow 3s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.98);
                opacity: 0.85;
                filter: drop-shadow(0 0 4px #22c55e);
            }
            100% {
                transform: scale(1.03);
                opacity: 1;
                filter: drop-shadow(0 0 14px #00ff00) drop-shadow(0 0 22px #10b981);
            }
        }

        .speech-pointer {
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background-color: #232521;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            z-index: 0;
        }
        
        .font-madness {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.5px;
        }
        
        .font-everything {
            font-family: 'Special Elite', monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Sticky Top Header & Edge-to-Edge Banner -->
    <header class="fixed top-0 left-0 w-full z-50 bg-[#161816]/95 backdrop-blur-md shadow-2xl border-b border-white/5">
        <!-- Full-Width Edge-to-Edge Scrolling Banner -->
        <div class="matrix-banner h-[130px] sm:h-[150px] w-full relative">
            <button class="absolute top-3 right-4 bg-black/50 hover:bg-black/75 transition rounded-full p-2 backdrop-blur-sm z-10 border border-white/10 text-white shadow-md">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="19" cy="12" r="1"></circle>
                    <circle cx="5" cy="12" r="1"></circle>
                </svg>
            </button>
        </div>

        <!-- Avatar & Speech Bubble Section with Clear Gap -->
        <div class="px-4 sm:px-6 pb-3 relative flex items-end max-w-[600px] mx-auto w-full gap-6 -mt-[45px]">
            
            <!-- Avatar Container with Radiating Energy Beams -->
            <div class="relative z-10 flex-shrink-0">
                <div class="avatar-aura"></div>

                <div class="w-[90px] h-[90px] rounded-full border-[6px] border-[#161816] bg-black overflow-hidden relative flex items-center justify-center z-10 shadow-xl">
                    <!-- <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='grad' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%23328f10'/><stop offset='65%25' stop-color='%23134c03'/><stop offset='100%25' stop-color='%23031200'/></radialGradient><radialGradient id='glow' cx='50%25' cy='50%25' r='50%25'><stop offset='60%25' stop-color='transparent'/><stop offset='100%25' stop-color='%2370e000'/></radialGradient></defs><circle cx='50' cy='50' r='50' fill='url(%23grad)'/><circle cx='50' cy='50' r='50' fill='url(%23glow)'/><path d='M50 18 C25 18 20 45 20 58 C20 78 40 90 50 90 C60 90 80 78 80 58 C80 45 75 18 50 18 Z' fill='white'/><path d='M31 50 C26 62 35 70 42 66 C47 62 42 48 31 50 Z' fill='%230c2005' transform='rotate(-12 36 58)'/><path d='M69 50 C74 62 65 70 58 66 C53 62 58 48 69 50 Z' fill='%230c2005' transform='rotate(12 64 58)'/><path d='M46 80 Q50 83 54 80' stroke='%230c2005' stroke-width='2' stroke-linecap='round' fill='none'/></svg>" 
                         alt="Alien Avatar" 
                         class="w-full h-full object-cover"> -->

<img src="img\logo_cirlce.png" Alt="Alien Avatar" class="w-full h-full object-cover">
                </div>

                <!-- Do Not Disturb Icon -->
                <div class="absolute bottom-0 right-0 w-[26px] h-[26px] bg-[#161816] rounded-full flex items-center justify-center z-20 shadow-md">
                    <div class="w-4 h-4 bg-red-500 rounded-full flex items-center justify-center">
                        <div class="w-2.5 h-[3px] bg-[#161816] rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Speech Bubble with distinct gap -->
            <div class="relative bg-[#232521] text-gray-200 text-[13px] font-semibold px-3.5 py-1.5 rounded-2xl border border-white/5 shadow-lg mb-5">
                <div class="speech-pointer"></div>
                <span class="relative z-10">real human experiences</span>
            </div>
            
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="pt-[205px] sm:pt-[225px] px-4 pb-12 max-w-[600px] mx-auto w-full">
        
        <!-- Profile Identity -->
        <div class="mt-2 text-white">
            <h1 class="text-[22px] font-black uppercase tracking-wide text-[#e0e4ff] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
                ALIEN IN DISGUISE
            </h1>
            
            <div class="flex items-center gap-1.5 mt-0.5">
                <span class="text-[13px] text-gray-300 font-medium">alienindisgui.se</span>
            </div>
        </div>

        <!-- Bio Section -->
        <div class="mt-4 text-[15px] text-gray-200 leading-[1.6]">
            <span class="font-bold tracking-widest text-[13px]">PASSION,</span> 
            <span class="font-madness italic text-[17px] text-gray-300">madness,</span> 
            <span class="font-medium">and</span> 
            <span class="font-everything text-white inline-block transform -translate-y-0.5 text-[15px]">EVERYTHING</span> 
            <span>in-between.</span>
        </div>

        <!-- Tags & Badges Grid -->
        <div class="mt-5 flex flex-wrap gap-2">
            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-red-500/60 rounded-md px-2.5 py-1.5 shadow-inner">
                <div class="w-2 h-2 rounded-full bg-[#00ff00]"></div>
                <span class="text-[12px] font-semibold text-gray-200">Alien 👽</span>
            </div>
            
            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-white/5 rounded-md px-2.5 py-1.5">
                <div class="w-2 h-2 rounded-full bg-[#a855f7]"></div>
                <span class="text-[12px] font-semibold text-gray-300">Supporters</span>
            </div>

            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-white/5 rounded-md px-2.5 py-1.5">
                <div class="w-2 h-2 rounded-full bg-[#22c55e]"></div>
                <span class="text-[12px] font-semibold text-gray-300">adhd</span>
            </div>

            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-white/5 rounded-md px-2.5 py-1.5">
                <div class="w-2 h-2 rounded-full bg-[#22c55e]"></div>
                <span class="text-[12px] font-semibold text-gray-300">Vegan</span>
            </div>

            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-white/5 rounded-md px-2.5 py-1.5">
                <div class="w-2 h-2 rounded-full bg-[#84cc16]"></div>
                <span class="text-[12px] font-semibold text-gray-300">Flumskum Vibe</span>
            </div>

            <div class="flex items-center gap-1.5 bg-[#1e201d] border border-white/5 rounded-md px-2.5 py-1.5">
                <div class="w-2 h-2 rounded-full bg-[#f97316]"></div>
                <span class="text-[12px] font-semibold text-gray-300">Medlem</span>
            </div>
        </div>

        <!-- Edit Profile Button -->
        <button class="w-full mt-7 bg-[#143812] hover:bg-[#1a4a17] transition-colors duration-200 py-3 rounded-lg text-[13px] font-bold text-white flex items-center justify-center gap-2 shadow-lg border border-green-800/40 cursor-pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
            Edit Profile
        </button>

    </main>

</body>
</html>
